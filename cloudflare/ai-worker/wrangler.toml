name = "lende-ai"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Workers AI-bindingen opprettes automatisk ved deploy — ingen nøkkel trengs.
[ai]
binding = "AI"

# Modellbytte = endre linja under og deploye på nytt (leverandør-agnostisk
# design; se docs/MCP_REMOTE_CHAT.md «Modellvalg og kostnad»).
# Historikk: GLM-4.7-flash forkastet (resonnerings-modell, brant budsjettet på
# engelsk «tenking»). Llama 3.3 70B fp8-fast (v3.0.31–v4.3.10) hadde solid
# norsk men beviselig skjør funksjonskalling — hermetiske engelske avvisninger
# («Your input is lacking …») og verktøykall dumpet som råtekst med
# hallusinerte koordinater. Llama 4 Scout (v4.3.11): nyere funksjonskalling,
# samme chat-completions+tools-form (drop-in for lendeAi.js), og ~1/3 av
# output-prisen ($0,66 vs $2,25 per M tokens) — neurons-forbruket omtrent
# halveres per melding.
[vars]
MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

# Secreten LENDE_AI_TOKENS (kommaseparerte per-bruker-tokens) settes IKKE her.
# CI-deployen (.github/workflows/deploy-ai-worker.yml) pusher den fra GitHub-
# secreten med samme navn; alternativt Cloudflare-dashbordet (Worker →
# Settings → Variables and Secrets) eller `npx wrangler secret put LENDE_AI_TOKENS`.
