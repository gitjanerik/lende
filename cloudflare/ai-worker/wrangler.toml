name = "lende-ai"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Workers AI-bindingen opprettes automatisk ved deploy — ingen nøkkel trengs.
[ai]
binding = "AI"

# Modellbytte = endre linja under og deploye på nytt (leverandør-agnostisk
# design; se docs/MCP_REMOTE_CHAT.md «Modellvalg og kostnad»).
# Historikk: GLM-4.7-flash forkastet (resonnerings-modell, brant budsjettet på
# engelsk «tenking»). Llama 3.3 70B fp8-fast (v3.0.31–v4.3.10) hadde solid
# norsk men beviselig skjør funksjonskalling — hermetiske engelske avvisninger
# («Your input is lacking …») og verktøykall dumpet som råtekst med
# hallusinerte koordinater. Llama 4 Scout (v4.3.11–v6.5.79, $0,27/$0,85 per M)
# rettet funksjonskallingen, men svarte ustøtt: unødvendige oppklarings-
# spørsmål, selvmotsigelser rett etter et vellykket verktøykall og ugrammatisk
# norsk.
# gpt-oss-120b (v6.5.80–v8.0.10): $0,35 inn / $0,75 ut per M. Solid
# funksjonskalling, men svak norsk og ustø i lange verktøykjeder.
# GLM-5.2 og Kimi K2.6 (testet v8.0.7) fases ut 20.11.2026, og GLM-4.7-flash
# holdt ikke mål i en ny runde (v8.0.10).
# Claude Haiku 5.5 (v8.0.11): partnermodell via Workers AI, $0,10 inn / $0,50
# ut per M (under 100K tokens). Det er INPUT som dominerer — prompten og
# verktøyskjemaene sendes på nytt hver verktøyrunde. Valget i Utvikler-fana
# er fjernet: én modell. Reserven (gpt-oss-120b) ble fjernet i v8.0.15 —
# feiler Haiku, sier chatten «ikke tilgjengelig» i stedet for å bytte modell.
[vars]
MODEL = "anthropic/claude-haiku-5.5"

# Lav innsats: en chat skal svare, ikke resonnere i lengden. Feltet sendes,
# og kallet kjøres om uten det hvis modellen avviser det (kjor() i index.js).
# Tom verdi = ikke send feltet i det hele tatt.
REASONING_EFFORT = "low"

# Secreten LENDE_AI_TOKENS (kommaseparerte per-bruker-tokens) settes IKKE her.
# CI-deployen (.github/workflows/deploy-ai-worker.yml) pusher den fra GitHub-
# secreten med samme navn; alternativt Cloudflare-dashbordet (Worker →
# Settings → Variables and Secrets) eller `npx wrangler secret put LENDE_AI_TOKENS`.
