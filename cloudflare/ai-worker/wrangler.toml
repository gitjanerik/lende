name = "lende-ai"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Workers AI-bindingen opprettes automatisk ved deploy — ingen nøkkel trengs.
[ai]
binding = "AI"

# Modellbytte = endre linja under og deploye på nytt (leverandør-agnostisk
# design; se docs/MCP_REMOTE_CHAT.md «Modellvalg og kostnad»).
# Llama 3.3 70B valgt for Fase 2 (v3.0.31): GLM-4.7-flash er en resonnerings-
# modell — den brukte hele token-budsjettet på «tenking» (på engelsk) før
# svaret, og svarer i OpenAI-format. Llama svarer direkte i klassisk
# {response}-format og har solid norsk. Klienten (lendeAi.js) forstår nå
# uansett begge formatene, så bytte tilbake (f.eks. for verktøy i Fase 3)
# er fortsatt bare denne linja.
[vars]
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Secreten LENDE_AI_TOKENS (kommaseparerte per-bruker-tokens) settes IKKE her.
# CI-deployen (.github/workflows/deploy-ai-worker.yml) pusher den fra GitHub-
# secreten med samme navn; alternativt Cloudflare-dashbordet (Worker →
# Settings → Variables and Secrets) eller `npx wrangler secret put LENDE_AI_TOKENS`.
