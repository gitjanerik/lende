name: Fasit — kart-pipelinen mot ekte data

# Bygger seks ekte kart (Overpass + Kartverket WCS + N50 + Sjøkart) og sjekker
# invarianter + avvik mot lagret fasit. Dette er sikkerhetsnettet enhetstestene
# ikke kan være: feilene i kart-pipelinen bor i SAMMENSETNINGEN på ekte
# geografi, og de har historisk kostet nesten hver tiende utgivelse.
#
# Kjøres ved endring i pipelinen, ukentlig (kildene endrer seg under oss), og
# manuelt. Ikke i `npm run test` — den skal være offline og rask.

on:
  push:
    paths:
      - 'src/lib/mapBuilder.js'
      - 'src/lib/seaFromDem.js'
      - 'src/lib/marineTopology.js'
      - 'src/lib/dem.js'
      - 'src/lib/demFetcher.js'
      - 'src/lib/canopyHeight.js'
      - 'src/lib/n50*.js'
      - 'src/lib/nveLakeFetcher.js'
      # Vann-sammenslåingen er delt mellom appen og headless (v5.18.3). Fasiten
      # bygger gjennom headless, så den måler faktisk denne koden nå — og det er
      # nettopp her de to pipelinene sprikte uten at noen gate så det.
      - 'src/lib/vannMerge.js'
      - 'src/lib/createMapFlow.js'
      - 'src/lib/sjokart*.js'
      - 'src/lib/symbolizer.js'
      - 'src/lib/isomCatalog.json'
      - 'src/lib/routing.js'
      - 'src/lib/kartFasit.js'
      - 'scripts/fasit-kart.js'
      - 'scripts/fasit/**'
      - 'mcp/headless.js'
      - '.github/workflows/fasit-kart.yml'
  schedule:
    # Mandag 04:12 UTC — kildene (OSM, N50, Sjøkart) endrer seg uten at vi
    # rører kode, og da vil vi vite det før brukeren ser det.
    - cron: '12 4 * * 1'
  workflow_dispatch:
    inputs:
      steder:
        description: 'Steder (tom = alle): vardasen kolstadoya strykenasen gjende henningsvaer rondvassbu'
        required: false
        default: ''
      oppdater:
        description: 'Skriv ny fasit og commit den (BARE etter at diffen er lest)'
        required: false
        type: boolean
        default: false

# Kun for oppdater-kjøringer: da commiter jobben den nye baselinen.
permissions:
  contents: write

jobs:
  fasit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Trengs for å pushe den nye baselinen tilbake til branchen.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Kjør fasit-suiten
        id: fasit
        run: |
          node scripts/fasit-kart.js ${{ github.event.inputs.steder }} \
            ${{ github.event.inputs.oppdater == 'true' && '--oppdater' || '' }} \
            --json fasit-rapport.json

      # `--oppdater` er BARE korrekt der alle kildene svarer. På en utviklings-
      # maskin (eller i en sandkasse der NVE gir 403) måler man en degradert
      # pipeline og skriver de tallene inn som sannhet — stikk motsatt av hva
      # fasiten er til for. Derfor bor oppdateringen her, i CI, som en knapp man
      # trykker på ETTER å ha lest diffen i en vanlig kjøring.
      - name: Commit ny fasit
        if: github.event.inputs.oppdater == 'true'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fasit/baseline.json
          if git diff --staged --quiet; then
            echo "Fasiten var alt à jour"
          else
            git diff --staged --stat
            git -c commit.gpgsign=false commit \
              --author="Fasit <fasit@lende>" \
              -m "Fasit-baseline målt i CI (alle kilder tilgjengelige)"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "Committet ny fasit-baseline"
          fi

      # Rapporten lastes opp uansett utfall — den er selve diagnosen når noe
      # har endret seg, og inneholder tallene per sted.
      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fasit-rapport
          path: fasit-rapport.json
          retention-days: 30
