name: Build nasjonalpark-datasett

# Genererer public/data/nasjonalparker.json fra OpenStreetMap/Overpass (full
# nett-tilgang i CI) og committer den tilbake til branchen. Trigges manuelt, og
# automatisk når build-scriptet/workflowen endres. Endringer i selve JSON-en
# matcher ikke paths-filteret → ingen re-trigger-løkke.
#
# Parkgrensene er statiske, men OSM får jevnlig rettelser (og et par norske
# parker mangler ennå som relasjon) — kjør workflowen manuelt for å friske opp.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 */3 *'   # kvartalsvis oppfriskning
  push:
    branches: ['**']
    paths:
      - 'scripts/build-nasjonalparker.js'
      - '.github/workflows/build-nasjonalparker.yml'

permissions:
  contents: write

jobs:
  build-nasjonalparker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate national park dataset from Overpass
        run: node scripts/build-nasjonalparker.js

      - name: Commit dataset if changed
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/nasjonalparker.json
          if git diff --staged --quiet; then
            echo "Ingen endring i nasjonalpark-datasettet"
          else
            git -c commit.gpgsign=false commit \
              --author="Deploy <deploy@lende>" \
              -m "Nasjonalpark-datasett fra OSM (auto-generert)"
            # Push med retry. To datasett-workflows kan kjøre på SAMME push — en
            # actions-bump rører begge workflow-filene, så begge path-filtrene
            # treffer — og begge pusher til samme gren. Den som taper kappløpet
            # fikk «non-fast-forward» og feilet, uten at noe var galt med
            # dataene. Det skjedde i v5.22.4: redlist tapte mot nasjonalparker
            # på en ren actions-oppdatering.
            #
            # Vi rebaser IKKE: actions/checkout gir en grunn klone, og en rebase
            # over en shallow-grense er upålitelig. I stedet tar vi vare på
            # artefakten, flytter til den nye tippen, og legger den på igjen.
            # Filen er generert og eies av denne jobben alene, så det kan ikke
            # overskrive noe andres arbeid.
            for forsok in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                echo "Committet oppdatert nasjonalpark-datasett"
                break
              fi
              if [ "$forsok" = 3 ]; then
                echo "::error::ga opp å pushe public/data/nasjonalparker.json etter 3 forsøk"
                exit 1
              fi
              echo "push avvist (forsøk $forsok) — flytter til ny tipp og prøver igjen"
              cp public/data/nasjonalparker.json "$RUNNER_TEMP/artefakt.json"
              git fetch --depth=1 origin "${GITHUB_REF_NAME}"
              git reset --hard FETCH_HEAD
              cp "$RUNNER_TEMP/artefakt.json" public/data/nasjonalparker.json
              git add public/data/nasjonalparker.json
              if git diff --staged --quiet; then
                echo "Ny tipp har alt dette innholdet — ingenting å pushe"
                exit 0
              fi
              git -c commit.gpgsign=false commit \
                --author="Deploy <deploy@lende>" \
                -m "Nasjonalpark-datasett fra OSM (auto-generert)"
            done
          fi
