name: Røyktest — MapView i en ekte nettleser

# Sikkerhetsnettet enhetstestene ikke kan være. Tre monteringsfeil under
# v5.8.0-uttrekket (TDZ på verdier sendt inn før de er deklarert, og en
# tekst-sletting som tok med seg tre ubeslektede blokker) passerte BÅDE
# `npm run test` (1 978 tester) og `npm run build` uten en lyd: Vue-oppsettet
# kaster først ved montering, og et bygg monterer ingenting.
#
# To komplementære gater:
#   • royk      — monterer /kart/vardasen og trykker på hvert uttrukket domene.
#                 Fanger feil som KASTER (TDZ, udefinerte navn, brutt wiring).
#   • navnediff — hva forsvant ut av MapView, og hvem overtok det.
#                 Fanger feil som forsvinner STILLE (en slettet watch, et
#                 composable-kall ingen tok over).
#   • royk:ruter — hver rute, hver redirect og boot-gjenopptaket. royk monterer
#                 ÉN rute og sier ingenting om at /about lander på /om eller at
#                 en funksjons-redirect beholder query-en. Lagt til ved
#                 vue-router 4 → 5 (v5.22.7), som er nøyaktig når slikt brytes.
#
# Kjører på PR-er som rører MapView, composable-ene eller malen. Kartet
# (public/maps/vardasen.svg) ligger i repoet, så monteringen trenger ikke nett.

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/views/MapView.vue'
      - 'src/composables/**'
      - 'src/components/**'
      # src/lib/** er 3D-motoren (sceneCore, skyDome, freeRig, scene3d), og det
      # er nettopp den de tre 3D-sjekkene trykker på. Sto ikke her fram til
      # v5.28.0, så en ren lib-endring kunne lande uten at røyktesten kjørte i
      # det hele tatt — hullet ble oppdaget ved at denne PR-en falt gjennom det.
      # `scripts/trenger-ektekart.mjs` har hatt `^src/lib/` på MÅ-lista hele
      # tida, så gaten som avgjør OM det bygges et ekte kart var enig; det var
      # gaten som avgjør om testen kjører som manglet stien.
      - 'src/lib/**'
      - 'scripts/royk-mapview.mjs'
      - 'scripts/navnediff.mjs'
      - 'scripts/ruter-royk.mjs'
      - 'src/router.js'
      - 'src/App.vue'
      - '.github/workflows/royktest.yml'
  workflow_dispatch:

jobs:
  royk:
    runs-on: ubuntu-latest
    # BAKSTOPPER. Uten den er GitHubs default seks timer, og en hengt nettleser
    # blokkerer da hver framtidige PR i et halvt døgn. Måltid for jobben er
    # ~5 min med ekte kart; 30 gir romslig margin og fanger hengingen i stedet
    # for å vente den ut. Røyk-skriptet har sitt eget tak PR SJEKK (120 s) —
    # dette er nettet under det, for det som skjer utenfor en sjekk.
    timeout-minutes: 30
    steps:
      # IKKE fetch-depth: 0. Målt på v5.25.2-PR-en: full historikk kostet
      # 2 min 39 s av jobbens 5 min 29 s, mens CI-jobbens grunne checkout av
      # samme commit tok 3 s. Repoet har bare ~51 commits, men et .git på 100 MB
      # (genererte kart-SVG-er i historikken), så «kort historikk» er ikke det
      # samme som «billig å hente». Navnediff trenger ÉN blob — MapView.vue på
      # master-tippen — og den hentes eksplisitt i sitt eget steg under.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hent Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Hentes ÉN gang her: både ektekart-gaten under og navnediff til slutt
      # måler mot master-tippen. Eksplisitt refspec — se navnediff-steget for
      # hvorfor `git fetch origin master` ikke holder på en grunn klone.
      - name: Hent master-tippen
        run: git fetch --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      # --ektekart bygger et ferskt Vardåsen-kart fra Kartverket + OSM og koster
      # ~2 av jobbens ~3 minutter. Sju av tjue sjekker krever det; de tretten
      # andre klarer seg med det sporede demo-kartet. Gaten avgjør hvilken vei vi
      # går, og logikken bor i scripts/trenger-ektekart.mjs — med enhetstester,
      # fordi en gate som faller til feil side lar sju sjekker hoppe STILLE over.
      # Ukjente stier faller til den dyre siden med vilje.
      - name: Trenger endringen et ekte kart?
        id: kart
        run: |
          endret=$(git diff --name-only origin/master HEAD)
          echo "Endrede filer:"; echo "$endret" | sed 's/^/  /'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ekte=1" >> "$GITHUB_OUTPUT"
            echo "→ manuell kjøring: full dekning uansett"
          elif echo "$endret" | node scripts/trenger-ektekart.mjs; then
            echo "ekte=1" >> "$GITHUB_OUTPUT"
          else
            echo "ekte=0" >> "$GITHUB_OUTPUT"
          fi

      # Feiler kart-byggingen (kildene nede), går røyktesten videre på demo-kartet
      # og RAPPORTERER hva den hoppet over — en PR skal ikke blokkeres av at
      # Overpass har en dårlig dag.
      - name: Røyktest
        # STEG-TAK I TILLEGG TIL JOBB-TAKET. Jobbens `timeout-minutes` skal
        # dekke dette, men på kjøringen som avdekket problemet gjorde den det
        # IKKE — jobben sto over en halvtime forbi taket og måtte kanselleres
        # for hånd. Et steg-tak er nærmere det som henger, og gir loggen fra
        # stegene før seg. To tak er ikke overdrevet når det ene har sviktet.
        timeout-minutes: 20
        run: |
          if [ "${{ steps.kart.outputs.ekte }}" = "1" ]; then
            npm run royk -- --ektekart --bilder=/tmp/royk
          else
            echo "Kjører mot demo-kartet — de sju ektekart-sjekkene hoppes over."
            npm run royk -- --bilder=/tmp/royk
          fi

      # Rutingen: alle ruter, alle redirects, boot-gjenopptaket. Bruker samme
      # dist/ som røyktesten over, så den koster bare noen sekunder.
      - name: Røyktest — ruting
        run: npm run royk:ruter

      # Navnediff er en LESE-gate: den skal fortelle mennesket hva som forsvant.
      # Villede slettinger kvitteres ut med `--ok navn1,navn2` i PR-en som gjør
      # dem, ikke ved å skru av jobben.
      # Refen er hentet i «Hent master-tippen» over. Formen der er eksplisitt
      # refspec og ikke `git fetch origin master`: på en grunn klone lagrer den
      # formen bare i FETCH_HEAD og avvises dessuten med «shallow roots are not
      # allowed to be updated», så refs/remotes/origin/master blir aldri
      # opprettet og navnediff feiler med «fant ikke MapView.vue i
      # origin/master». Med fetch-depth: 0 var det checkout som skaffet refen,
      # så linja som sto her før var i praksis en no-op.
      - name: Navnediff mot origin/master
        run: npm run navnediff

      - name: Last opp skjermbilder ved feil
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: royk-skjermbilder
          path: /tmp/royk
          if-no-files-found: ignore
