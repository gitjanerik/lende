name: Røyktest — MapView i en ekte nettleser

# Sikkerhetsnettet enhetstestene ikke kan være. Tre monteringsfeil under
# v5.8.0-uttrekket (TDZ på verdier sendt inn før de er deklarert, og en
# tekst-sletting som tok med seg tre ubeslektede blokker) passerte BÅDE
# `npm run test` (1 978 tester) og `npm run build` uten en lyd: Vue-oppsettet
# kaster først ved montering, og et bygg monterer ingenting.
#
# To komplementære gater:
#   • royk      — monterer /kart/vardasen og trykker på hvert uttrukket domene.
#                 Fanger feil som KASTER (TDZ, udefinerte navn, brutt wiring).
#   • navnediff — hva forsvant ut av MapView, og hvem overtok det.
#                 Fanger feil som forsvinner STILLE (en slettet watch, et
#                 composable-kall ingen tok over).
#   • royk:ruter — hver rute, hver redirect og boot-gjenopptaket. royk monterer
#                 ÉN rute og sier ingenting om at /about lander på /om eller at
#                 en funksjons-redirect beholder query-en. Lagt til ved
#                 vue-router 4 → 5 (v5.22.7), som er nøyaktig når slikt brytes.
#
# Kjører på PR-er som rører MapView, composable-ene eller malen. Kartet
# (public/maps/vardasen.svg) ligger i repoet, så monteringen trenger ikke nett.

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/views/MapView.vue'
      - 'src/composables/**'
      - 'src/components/**'
      - 'scripts/royk-mapview.mjs'
      - 'scripts/navnediff.mjs'
      - 'scripts/ruter-royk.mjs'
      - 'src/router.js'
      - 'src/App.vue'
      - '.github/workflows/royktest.yml'
  workflow_dispatch:

jobs:
  royk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # navnediff trenger origin/master å måle mot

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hent Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # --ektekart: bygg et ferskt Vardåsen-kart fra Kartverket + OSM (~12 s) og
      # test mot det. Det sporede demo-kartet har 7 labels og ingen data-bbox, så
      # navn-LOD og culling har ingenting å gjøre der og sjekkene deres hoppes
      # over. Feiler kart-byggingen (kildene nede), går røyktesten videre på
      # demo-kartet og RAPPORTERER hva den hoppet over — en PR skal ikke blokkeres
      # av at Overpass har en dårlig dag.
      - name: Røyktest
        run: npm run royk -- --ektekart --bilder=/tmp/royk

      # Rutingen: alle ruter, alle redirects, boot-gjenopptaket. Bruker samme
      # dist/ som røyktesten over, så den koster bare noen sekunder.
      - name: Røyktest — ruting
        run: npm run royk:ruter

      # Navnediff er en LESE-gate: den skal fortelle mennesket hva som forsvant.
      # Villede slettinger kvitteres ut med `--ok navn1,navn2` i PR-en som gjør
      # dem, ikke ved å skru av jobben.
      - name: Navnediff mot origin/master
        run: |
          git fetch origin master --quiet
          npm run navnediff

      - name: Last opp skjermbilder ved feil
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: royk-skjermbilder
          path: /tmp/royk
          if-no-files-found: ignore
