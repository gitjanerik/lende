# Deployer KI-Workeren (cloudflare/ai-worker) til Cloudflare. Kjører ved push
# til master som endrer Worker-mappa, og kan startes manuelt fra Actions-fanen.
# Krever repo-secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID og
# LENDE_AI_TOKENS (kommaseparerte per-bruker-tokens — pushes som Worker-secret
# ved hver deploy, så brukerlista redigeres i GitHub-secreten alene).
#
# Rekkefølgen er bevisst (v3.0.32): secret-push FØR deploy, så siste deployede
# Worker-versjon alltid er den wrangler.toml beskriver — `secret put` lager
# nemlig sin egen versjon, og lå den sist kunne røyktesten treffe feil versjon.
# Røyktesten poller /health til forventet modell svarer (edge-propagering tar
# av og til opp mot et minutt) i stedet for å håpe på en fast sleep.
name: Deploy AI-worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cloudflare/ai-worker/**'
      - '.github/workflows/deploy-ai-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Push token-secret til Worker
        run: |
          if [ -n "$LENDE_AI_TOKENS" ]; then
            # Tolerant: ved aller første deploy finnes ikke Workeren ennå, og
            # secret put feiler — deploy-steget under oppretter den, og neste
            # kjøring setter secreten. Ellers stopper en ekte feil her jobben
            # via røyktesten (401-porten svarer 500 uten secret).
            echo "$LENDE_AI_TOKENS" | npx wrangler secret put LENDE_AI_TOKENS \
              || echo "::warning::secret put feilet — første deploy? Kjør workflowen på nytt etterpå."
          else
            echo "::warning::LENDE_AI_TOKENS-secret mangler i GitHub — Workeren vil svare 500 til den settes."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LENDE_AI_TOKENS: ${{ secrets.LENDE_AI_TOKENS }}
      - name: Deploy Worker (siste versjon = wrangler.toml)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Røyktest mot deployet Worker
        run: |
          BASE=https://lende-ai.jepedersen73.workers.dev
          FORVENTET=$(grep -oP '^MODEL = "\K[^"]+' wrangler.toml)
          echo "Forventet modell: $FORVENTET"
          echo "— venter på at /health rapporterer forventet modell (maks ~2 min) —"
          OK=""
          for i in $(seq 1 24); do
            HELSE=$(curl -fsS "$BASE/health" || true)
            if echo "$HELSE" | grep -qF "\"$FORVENTET\""; then OK=1; echo "$HELSE"; break; fi
            echo "  forsøk $i: $HELSE"
            sleep 5
          done
          test -n "$OK" || { echo "::error::/health rapporterte aldri $FORVENTET — henger en gammel versjon igjen?"; exit 1; }
          echo "— /api/ai uten token skal gi 401 —"
          KODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/api/ai" \
            -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hei"}]}')
          test "$KODE" = "401" || { echo "::error::Forventet 401 uten token, fikk $KODE"; exit 1; }
          echo "OK (401)"
          if [ -n "$LENDE_AI_TOKENS" ]; then
            echo "— /api/ai med token + norsk prompt —"
            TOK="${LENDE_AI_TOKENS%%,*}"
            SVAR=$(curl -fsS -X POST "$BASE/api/ai" \
              -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
              -d '{"messages":[{"role":"user","content":"Svar med én kort setning på norsk: hva er en ekvidistanse på et turkart?"}],"max_tokens":300}')
            echo "$SVAR" | head -c 500; echo
            # Godta begge svarformatene fra Workers AI: klassisk {response} og
            # OpenAI-stil choices[].message.content (må ha faktisk tekst — en
            # resonneringsmodell som brenner budsjettet gir content:null og skal feile).
            echo "$SVAR" | grep -Eqi '"response"|"content": *"' || { echo "::error::Fant ikke tekstsvar fra modellen"; exit 1; }
          fi
        env:
          LENDE_AI_TOKENS: ${{ secrets.LENDE_AI_TOKENS }}
