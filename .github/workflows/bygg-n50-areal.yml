name: Bygg N50-arealdekke

# Baker N50 arealdekke (myr, skog, isbre) til statiske fliser i
# public/data/n50-areal/ og committer dem tilbake til branchen.
#
# «typer» ER GRUNNEN TIL AT SKOGEN MANGLET. Bake-scriptet kunne bære skog fra
# første dag, men `--typer` sto på sin default `myr` og denne workflowen hadde
# ingen knott for den — så det fantes ingen vei til skogen herfra, uansett hvor
# mange ganger jobben ble kjørt. Legger du til en ny type i scriptet, legg den
# til i beskrivelsen under samtidig; en knott ingen vet om er ingen knott.
#
# KJØR «bare mål» FØRST. Flater er tyngre enn linjer, og myr dekker ~9 % av
# Norge — stinettet ble 12 MB, og vi vet ikke på forhånd hva dette blir.
# «bare mål» laster ned, måler og skriver INGENTING, så arkitekturvalget
# (statiske filer i public/ vs egen lagring) tas på tall og ikke på håp. Det
# var rekkefølgen sti-baken brukte, og den sparte oss for et feilvalg.
#
# KJØRES MANUELT — bevisst ingen `schedule`, av samme grunn som sti-baken:
# arealdekke er stabile data, og hver bake gir nye filer → ny deploy → alle
# brukere laster dem ned på nytt.
#
# TO TING SOM KOSTET EN TIME Å LÆRE (v5.24.x):
#
#  1. KJØR ÉN NASJONAL JOBB OM GANGEN. Landsdekning laster ned ~2,5 GB fra
#     Geonorge. Alene tar den ~19 min; to samtidige kjøringer kvelte hverandre
#     og sto fortsatt på 40 min. Skal du måle OG bake, gjør det sekvensielt.
#
#  2. IKKE PUSH TIL GRENEN MENS EN BAKE KJØRER. Jobben sjekker ut én commit og
#     pusher flisene tilbake på slutten. Kommer det en commit imellom, avvises
#     pushen som non-fast-forward, og 25 minutters nedlasting er bortkastet.

on:
  workflow_dispatch:
    inputs:
      fylke:
        description: 'Fylkesnummer for en rask prøve (33 = Buskerud). Tomt = hele landet.'
        required: false
        default: ''
      toleranse:
        description: 'Forenkling i meter. Ett tall for alt, eller «myr=4,skog=8». Tomt = per-type-standard.'
        required: false
        default: ''
      typer:
        description: 'Hvilke arealtyper: myr, skog, isbre (komma­separert). Tomt = alle tre.'
        required: false
        default: ''
      minareal:
        description: 'Minste flate i m². Ett tall for alt, eller «myr=2500,skog=5000». Tomt = per-type-standard.'
        required: false
        default: ''
      bare_mal:
        description: 'Bare mål — skriv ingenting, ikke commit.'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installer GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin unzip
          ogr2ogr --version

      - name: Bak flisene
        # Heap-taket er hevet fordi baken HAR dødd på det. Med skog i tillegg
        # til myr ble runneren borte midt i Finnmark (522 MB kilde) etter fire
        # minutter, mens GitHubs API meldte «in_progress» i halvannen time
        # etterpå — så et minne-drap så ut som en treg jobb. Selve årsaken er
        # rettet i scriptet (forenkling skjer nå strømmende, per flate), men
        # `fliser`-akkumulatoren holder fortsatt hele landet før den skrives,
        # og runneren har 16 GB å ta av.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          ARGS=""
          # Tomt felt = scriptets egen per-type-standard. Å sende «4» her ville
          # tvunget myrens tall på skogen og gjort per-type-skruene meningsløse.
          if [ -n "${{ inputs.toleranse }}" ]; then ARGS="$ARGS --toleranse ${{ inputs.toleranse }}"; fi
          if [ -n "${{ inputs.minareal }}" ]; then ARGS="$ARGS --minareal ${{ inputs.minareal }}"; fi
          if [ -n "${{ inputs.typer }}" ]; then ARGS="$ARGS --typer ${{ inputs.typer }}"; fi
          if [ -n "${{ inputs.fylke }}" ]; then ARGS="$ARGS --fylke ${{ inputs.fylke }}"; fi
          if [ "${{ inputs.bare_mal }}" = "true" ]; then ARGS="$ARGS --mal"; fi
          node scripts/bygg-n50-areal.mjs $ARGS

      - name: Vis resultatet
        if: inputs.bare_mal != true
        run: |
          du -sh public/data/n50-areal
          ls public/data/n50-areal | head -5
          echo "… $(ls public/data/n50-areal | wc -l) filer totalt"

      - name: Commit hvis endret
        if: inputs.bare_mal != true
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/n50-areal
          # Bare commit ved REELL endring — en tom commit ville tvunget alle
          # brukere til å laste ned flisene på nytt uten grunn.
          if git diff --staged --quiet; then
            echo "Ingen endring i N50-arealflisene"
          else
            git -c commit.gpgsign=false commit \
              --author="Deploy <deploy@lende>" \
              -m "N50-arealdekke (auto-generert fra Kartverket N50 Arealdekke)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
