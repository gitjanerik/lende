name: Build map and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Generate Vardåsen SVG from OSM
        run: |
          node scripts/build-vardasen-svg.js
          echo "--- SVG-fil ---"
          ls -la public/maps/

      # Overflatekart til 3D-globene (månen, Mars, Jupiter, Saturn). Feiler ALDRI
      # hardt: klarer den ikke å hente et kart, tegnes den kula i legemets
      # egenfarge — gassplanetene får dessuten bånd tegnet på klienten, så de er
      # gjenkjennelige uansett. Steget ligger her og ikke i repoet fordi
      # NASA/USGS er sperret fra utviklingsmiljøet — se
      # scripts/bygg-himmelkart.mjs.
      #
      # LES UTSKRIFTEN: siste linje sier «N av 4 kart på plass». Er N lavere enn
      # forventet, har en URL råtnet — og det er den ENESTE måten å oppdage det,
      # siden alt annet fortsetter å virke.
      - name: Bake himmelkartene
        run: npm run bygg:himmelkart

      - name: Build app
        run: |
          npm run build
          echo "--- dist innhold ---"
          ls -la dist/
          ls -la dist/maps/ || echo "ingen maps-mappe i dist"

      # GRENEN HAR ÉN COMMIT, OG DET ER MED VILJE. Fram til v7.7.7 ble den
      # bygget med vanlige commits i et worktree, så historikken vokste
      # monotont — 434 commits ved v7.7.6, hver med et helt `dist/`, og fra
      # v5.26.0 med 117 MB fliser i seg. Innholdet er REN GENERERT OUTPUT:
      # det kan bakes på nytt fra master når som helst, og ingen har noe der å
      # miste. Derfor en foreldreløs commit og en force-push hver gang.
      #
      # To ting følger, og begge er lette å «rette» tilbake:
      #   1. Vi HENTER IKKE gh-pages først. Det er halve gevinsten — runneren
      #      slipper å laste ned en historikk vi er i ferd med å kaste.
      #   2. «Ingen endringer i dist» er borte som begrep. Uten en forelder
      #      finnes det ingenting å diffe mot, og sjekken hadde uansett aldri
      #      noe å spare: hver PR bumper versjonen, som står i `sw.js`, så
      #      `dist/` er ulikt ved hver eneste kjøring.
      #
      # GitHubs harde grense for et publisert Pages-nettsted er 1 GB; `dist/`
      # er 133 MB i dag, og med én commit er det også alt grenen veier.
      - name: Deploy to gh-pages
        run: |
          set -e
          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          SOURCE_MSG=$(git log -1 --pretty=%s)
          # Eget lokalt grennavn, så dette aldri kolliderer med en gh-pages-ref
          # som måtte ligge igjen i klonen.
          git worktree add --orphan -b gh-pages-bake /tmp/ghp
          cp -r dist/. /tmp/ghp/
          touch /tmp/ghp/.nojekyll
          cp /tmp/ghp/index.html /tmp/ghp/404.html
          cd /tmp/ghp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c commit.gpgsign=false commit \
            --author="Deploy <deploy@lende>" \
            -m "deploy v${APP_VERSION} (${SHORT_SHA}): ${SOURCE_MSG}"
          git push --force origin HEAD:gh-pages
          echo "Deployet v${APP_VERSION} til gh-pages (én commit)"

      - name: Verify gh-pages root is live
        run: |
          URL="https://gitjanerik.github.io/lende/"
          echo "Sjekker at root svarer 200: $URL"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || echo 000)
            echo "  forsøk $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Root er tilgjengelig (HTTP $code)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Root ($URL) svarte ikke 200 etter deploy."
          echo "Innholdet er pushet til gh-pages (index.html + .nojekyll ligger der),"
          echo "men GitHub Pages serverer det ikke — typisk at Pages ikke er aktivert."
          echo "Fiks: Settings → Pages → Source = 'Deploy from a branch',"
          echo "Branch = 'gh-pages' / '(root)'."
          exit 1
