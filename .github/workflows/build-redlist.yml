name: Build Norwegian Red List bundle

# Genererer public/data/redlist-no.json fra GBIF (full nett-tilgang i CI) og
# committer den tilbake til branchen. Trigges manuelt, og automatisk når selve
# build-scriptet/workflowen endres (så første push genererer dataene). Endringer
# i selve JSON-en matcher ikke paths-filteret → ingen re-trigger-løkke.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'scripts/build-redlist.js'
      - '.github/workflows/build-redlist.yml'
      - 'tools/redlist-2021.csv'

permissions:
  contents: write

jobs:
  build-redlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate red list bundle from GBIF
        run: node scripts/build-redlist.js

      - name: Commit bundle if changed
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/redlist-no.json
          if git diff --staged --quiet; then
            echo "Ingen endring i rødliste-bundelen"
          else
            git -c commit.gpgsign=false commit \
              --author="Deploy <deploy@lende>" \
              -m "Norsk rødliste-bundel fra GBIF (auto-generert)"
            # Push med retry. To datasett-workflows kan kjøre på SAMME push — en
            # actions-bump rører begge workflow-filene, så begge path-filtrene
            # treffer — og begge pusher til samme gren. Den som taper kappløpet
            # fikk «non-fast-forward» og feilet, uten at noe var galt med
            # dataene. Det skjedde i v5.22.4: redlist tapte mot nasjonalparker
            # på en ren actions-oppdatering.
            #
            # Vi rebaser IKKE: actions/checkout gir en grunn klone, og en rebase
            # over en shallow-grense er upålitelig. I stedet tar vi vare på
            # artefakten, flytter til den nye tippen, og legger den på igjen.
            # Filen er generert og eies av denne jobben alene, så det kan ikke
            # overskrive noe andres arbeid.
            for forsok in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                echo "Committet oppdatert rødliste-bundel"
                break
              fi
              if [ "$forsok" = 3 ]; then
                echo "::error::ga opp å pushe public/data/redlist-no.json etter 3 forsøk"
                exit 1
              fi
              echo "push avvist (forsøk $forsok) — flytter til ny tipp og prøver igjen"
              cp public/data/redlist-no.json "$RUNNER_TEMP/artefakt.json"
              git fetch --depth=1 origin "${GITHUB_REF_NAME}"
              git reset --hard FETCH_HEAD
              cp "$RUNNER_TEMP/artefakt.json" public/data/redlist-no.json
              git add public/data/redlist-no.json
              if git diff --staged --quiet; then
                echo "Ny tipp har alt dette innholdet — ingenting å pushe"
                exit 0
              fi
              git -c commit.gpgsign=false commit \
                --author="Deploy <deploy@lende>" \
                -m "Norsk rødliste-bundel fra GBIF (auto-generert)"
            done
          fi
