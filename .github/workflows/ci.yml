# CI for pull requests: kjør testsuiten og produksjonsbygget på hver PR mot
# master, så regresjoner fanges før merge (deploy-workflowen build-vardasen-map
# kjører kun på push til master og validerer ingenting på PR-stadiet).
name: CI

on:
  pull_request:
    branches: [master]
  # Manuell start. Finnes fordi GitHub av og til ikke oppretter kjøringen for en
  # nyåpnet PR (skjedde på #315): uten dette er eneste utvei å pushe på nytt,
  # og en tom commit for å vekke CI er ikke en løsning.
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

      # Avhengighets-status. RAPPORTERER, feiler ikke — samme prinsipp som
      # tredjeparts-røyktestene i deploy-proxy.yml. En PR om skyene skal ikke
      # blokkeres av at wrangler fikk en rådgivning i natt, og en gate som
      # feiler på ting utenfor PR-ens kontroll blir skrudd av innen en måned.
      # Les den i loggen; `npm run vedlikehold` lokalt gir samme tabell.
      - name: Avhengighets-status (rapporterer, feiler ikke)
        continue-on-error: true
        run: npm run vedlikehold

      # Denne feiler DERIMOT: en sårbarhet med høy alvorsgrad i en
      # RUNTIME-avhengighet er kode vi sender til nettleseren. --omit=dev
      # er hele poenget — uten den er dette wrangler-støy, med den er det
      # bunten brukerne laster ned.
      - name: Ingen høye funn i det vi sender til nettleseren
        run: npm audit --omit=dev --audit-level=high
