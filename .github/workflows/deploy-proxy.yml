# Deployer proxy-Workeren (cloudflare/proxy) til Cloudflare. Kjører ved push til
# master som endrer Worker-mappa, og kan startes manuelt fra Actions-fanen.
#
# Krever repo-secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (finnes alt,
# de to andre Workerne bruker dem) og NVE_HYDAPI_KEY (ny — se README).
#
# Hvorfor den finnes (v4.8.7): Workeren ble tidligere satt ut manuelt via
# Cloudflare-dashbordet, altså lim-inn-koden-på-mobil. Med denne workflowen er
# git push eneste steg, og NVE-nøkkelen bor i GitHub-secreten i stedet for å måtte
# tastes inn på nytt hver gang Workeren gjenopprettes eller døpes om.
#
# Rekkefølgen er hentet fra deploy-ai-worker.yml: secret-push FØR deploy, så siste
# deployede versjon alltid er den wrangler.toml beskriver (`secret put` lager sin
# egen versjon).
name: Deploy proxy-worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'cloudflare/proxy/**'
      - '.github/workflows/deploy-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Push NVE-nøkkelen til Worker
        run: |
          if [ -n "$NVE_HYDAPI_KEY" ]; then
            # Tolerant: ved aller første deploy finnes ikke Workeren ennå, og
            # secret put feiler — deploy-steget under oppretter den, og neste
            # kjøring setter secreten. Røyktesten fanger en ekte mangel.
            echo "$NVE_HYDAPI_KEY" | npx wrangler secret put NVE_HYDAPI_KEY \
              || echo "::warning::secret put feilet — første deploy? Kjør workflowen på nytt etterpå."
          else
            echo "::warning::NVE_HYDAPI_KEY mangler i GitHub — NVE-ruta svarer 500 til den settes. Kulturminne-ruta virker uansett."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVE_HYDAPI_KEY: ${{ secrets.NVE_HYDAPI_KEY }}
      - name: Deploy Worker (siste versjon = wrangler.toml)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Røyktest mot deployet Worker
        run: |
          BASE=https://lende-proxy.jepedersen73.workers.dev
          HAOYA="$BASE/brukerminner/collections/brukerminner/items?bbox=10.53,59.65,10.62,59.72&f=json&limit=10"

          # Er det VÅR worker som svarer? Cloudflare gir sin egen 404 for et
          # workers.dev-navn uten worker, og den er ikke til å skille fra vår på
          # statuskode alene (v4.8.7-fellen). CORS-headeren setter bare vi.
          echo "— ukjent path skal gi 404 fra VÅR worker (ingen åpen proxy) —"
          H=$(curl -s -D - -o /dev/null "$BASE/noe-annet")
          echo "$H" | grep -qi '^HTTP/[0-9.]* 404' \
            || { echo "::error::Forventet 404 på ukjent path"; echo "$H"; exit 1; }
          echo "$H" | grep -qi 'access-control-allow-origin' \
            || { echo "::error::404 uten CORS-header — dette er Cloudflares 404, ikke vår. Er workeren deployet?"; echo "$H"; exit 1; }
          echo "OK (404 fra vår worker)"

          echo "— NVE-ruta —"
          KODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/v1/Stations?Active=1")
          case "$KODE" in
            200) echo "OK (200)" ;;
            500) echo "::warning::NVE-ruta svarer 500 — NVE_HYDAPI_KEY-secreten mangler. Vannmålestasjoner virker ikke før den er satt." ;;
            *)   echo "::error::Uventet status $KODE fra NVE-ruta."; exit 1 ;;
          esac

          # ── Kulturminne-ruta: RAPPORTERER, feiler ikke ────────────────────
          # api.ra.no er en tredjepart vi ikke eier. Er den nede, er det ikke en
          # feil i vår deploy — v4.8.7 lot den velte hele jobben, som ville
          # blokkert enhver framtidig worker-endring så lenge Riksantikvaren er
          # nede. X-Lende-Upstream skiller opphavets status fra vår egen.
          echo "— kulturminne-ruta (Håøya) —"
          SVAR=""
          for i in $(seq 1 6); do
            SVAR=$(curl -sS -D /tmp/h -w '\nHTTP:%{http_code}' "$HAOYA" || true)
            echo "$SVAR" | grep -q 'HTTP:200' && break
            echo "  forsøk $i: $(echo "$SVAR" | tail -1)"
            sleep 5
          done
          STATUS=$(echo "$SVAR" | tail -1 | cut -d: -f2)
          KROPP=$(echo "$SVAR" | sed '$d')
          OPPSTROMS=$(grep -i '^x-lende-upstream:' /tmp/h | tr -d '\r' | cut -d' ' -f2 || true)
          echo "status: $STATUS   X-Lende-Upstream: ${OPPSTROMS:-(ingen)}"
          echo "$KROPP" | head -c 400; echo
          case "$STATUS" in
            200)
              ANTALL=$(echo "$KROPP" | grep -oE '"numberMatched" *: *[0-9]+' | grep -oE '[0-9]+$' || echo '?')
              echo "::notice::api.ra.no SVARER. numberMatched for Håøya = $ANTALL"
              if [ "$ANTALL" = "0" ]; then
                echo "::notice::Håøya har INGEN brukerminner — «(0)» i appen er da sant."
              else
                echo "::notice::Håøya HAR brukerminner. Virker det ikke i appen, er det klient-siden."
              fi
              ;;
            599) echo "::warning::Workeren fikk ikke forbindelse til api.ra.no i det hele tatt. Tjenesten er utilgjengelig — appen viser «(!)» til den er tilbake." ;;
            404) echo "::warning::api.ra.no ga 404. Er den vedvarende, er endepunktet flyttet og mapFeatureLight/mapFeatureFull må oppdateres." ;;
            5*)  echo "::warning::api.ra.no svarte $STATUS (opphavets feil, speilet). Tjenesten er nede — appen viser «(!)» til den er tilbake." ;;
            *)   echo "::warning::Uventet status $STATUS fra kulturminne-ruta." ;;
          esac
          echo "Deploy er OK uansett utfall over — api.ra.no er en tredjepart."

          # ── MET-ruta: RAPPORTERER, feiler ikke ────────────────────────────
          # Samme grunn som over: api.met.no er en tredjepart. MEN 403 er et
          # SPESIALTILFELLE vi vil se tydelig — den betyr nesten alltid at
          # User-Agent-headeren vår ikke er god nok for METs vilkår, altså en
          # feil i VÅR kode, ikke nedetid hos MET. Den eneste testen som kan
          # avsløre det er denne: api.met.no er blokkert fra utviklings-
          # sandkassene, så ruta kan ikke prøves noe annet sted enn her.
          echo "— MET-ruta (Vardåsen) —"
          VAER="$BASE/vaer/locationforecast/2.0/compact?lat=59.8300&lon=10.4400"
          SVAR=$(curl -sS -D /tmp/hm -w '\nHTTP:%{http_code}' "$VAER" || true)
          STATUS=$(echo "$SVAR" | tail -1 | cut -d: -f2)
          KROPP=$(echo "$SVAR" | sed '$d')
          OPPSTROMS=$(grep -i '^x-lende-upstream:' /tmp/hm | tr -d '\r' | cut -d' ' -f2 || true)
          CACHE=$(grep -i '^x-lende-cache:' /tmp/hm | tr -d '\r' | cut -d' ' -f2 || true)
          echo "status: $STATUS   X-Lende-Upstream: ${OPPSTROMS:-(ingen)}   X-Lende-Cache: ${CACHE:-(ingen)}"
          case "$STATUS" in
            200)
              # Sjekk at det faktisk ER et varsel og ikke en feilside med 200.
              echo "$KROPP" | grep -q '"timeseries"' \
                && echo "::notice::MET-ruta SVARER med et varsel (timeseries funnet)." \
                || echo "::warning::200 fra MET-ruta, men ingen timeseries i kroppen. Endret MET formatet?"
              ;;
            403) echo "::error::MET svarte 403 Forbidden. Det betyr så godt som alltid at User-Agent-en i MET_UA ikke godtas — se cloudflare/proxy/src/index.js. Værvarselet virker ikke før dette er rettet." ;;
            400) echo "::warning::MET svarte 400 Bad Request. Sender vi for mange desimaler? metKoordinat skal runde til 4." ;;
            429) echo "::warning::MET svarte 429 — for mange forespørsler. Cache-vinduet (MET_CACHE_S) er for kort." ;;
            599) echo "::warning::Workeren fikk ikke forbindelse til api.met.no i det hele tatt." ;;
            5*)  echo "::warning::api.met.no svarte $STATUS (opphavets feil, speilet). MET er nede — appen viser «Værvarsel ikke tilgjengelig»." ;;
            *)   echo "::warning::Uventet status $STATUS fra MET-ruta." ;;
          esac

          # Ugyldig koordinat skal gi VÅR 400, ikke et varsel for Guineabukta.
          echo "— MET-ruta avviser manglende lat —"
          KODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/vaer/locationforecast/2.0/compact?lon=10.44")
          [ "$KODE" = "400" ] \
            && echo "OK (400)" \
            || echo "::error::Forventet 400 for manglende lat, fikk $KODE. Et kall uten lat ville blitt et varsel for 0,0000/0,0000."
