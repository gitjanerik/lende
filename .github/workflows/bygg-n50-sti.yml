name: Bygg N50-stinettet / -vegnettet

# Baker N50 sti/traktorveg til statiske fliser i public/data/n50-sti/ og
# committer dem tilbake til branchen.
#
# KJØRES MANUELT — bevisst ingen `schedule`. N50-stier er stabile data: et
# stinett flytter seg ikke, og OSM (som hentes live ved hver kart-bygging) er
# det som fanger opp nye stier raskt. Kartverket publiserer ukentlig, men det
# gjelder stort sett veinett, bygninger og adresser. Vi tar en ny bake når vi
# har grunn til det, ikke etter klokka.
#
# Merk at hver bake gir nye filer → ny deploy → service worker-en henter dem
# på nytt hos brukerne. Det er én grunn til å ikke gjøre dette ofte.

on:
  workflow_dispatch:
    inputs:
      lag:
        description: 'sti → public/data/n50-sti/, veg → public/data/n50-veg/ (bilveg + jernbane, egen katalog).'
        required: false
        default: 'sti'
        type: choice
        options: ['sti', 'veg']
      mal:
        description: 'Bare mål størrelsen — skriv og commit ingenting. Kjør denne FØRST for et nytt lag.'
        required: false
        default: false
        type: boolean
      fylke:
        description: 'Fylkesnummer for en rask prøve (f.eks. 33 = Buskerud). Tomt = hele landet.'
        required: false
        default: ''
      toleranse:
        description: 'Forenkling i meter (standard 3).'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installer GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin unzip
          ogr2ogr --version

      - name: Bak flisene
        run: |
          set -o pipefail
          ARGS="--lag ${{ inputs.lag || 'sti' }} --toleranse ${{ inputs.toleranse || '3' }}"
          if [ "${{ inputs.mal }}" = "true" ]; then ARGS="$ARGS --mal"; fi
          if [ -n "${{ inputs.fylke }}" ]; then ARGS="$ARGS --fylke ${{ inputs.fylke }}"; fi
          node scripts/bygg-n50-sti.mjs $ARGS

      - name: Vis resultatet
        if: ${{ !inputs.mal }}
        run: |
          KAT=public/data/n50-${{ inputs.lag || 'sti' }}
          du -sh $KAT
          ls $KAT | head -5
          echo "… $(ls $KAT | wc -l) filer totalt"

      - name: Commit hvis endret
        if: ${{ !inputs.mal }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          KAT=public/data/n50-${{ inputs.lag || 'sti' }}
          git add $KAT
          # Bare commit ved REELL endring. N50-stier er stabile, så de fleste
          # bakingene er no-ops — og en tom commit ville tvunget alle brukere
          # til å laste ned flisene på nytt uten grunn.
          if git diff --staged --quiet; then
            echo "Ingen endring i $KAT"
          else
            git -c commit.gpgsign=false commit \
              --author="Deploy <deploy@lende>" \
              -m "N50-${{ inputs.lag || 'sti' }} (auto-generert fra Kartverket N50)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
