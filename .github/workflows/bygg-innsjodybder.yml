name: Bak innsjødybder (NVE)

# Maksdyp for NVEs ~600 dybdekartlagte innsjøer → src/lib/innsjoDybderData.js.
# Data som endres sjeldnere enn hvert år, så ingen cron: kjør den for hånd når
# NVE har målt opp nye innsjøer. NVE svarer 403 fra utviklings-sandkassene,
# derfor CI. Se scripts/bygg-innsjodybder.mjs.

on:
  workflow_dispatch:
  # workflow_dispatch registreres først når fila står på master, så første
  # bake kommer på push — samme grep som probene.
  push:
    paths:
      - 'scripts/bygg-innsjodybder.mjs'
      - '.github/workflows/bygg-innsjodybder.yml'

permissions:
  contents: write

jobs:
  bak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run bygg:innsjodybder
      - name: Commit hvis endret
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/innsjoDybderData.js
          if git diff --staged --quiet; then
            echo "Ingen endring i innsjødybdene"
          else
            git -c commit.gpgsign=false commit \
              --author="Deploy <deploy@lende>" \
              -m "Innsjødybder (auto-generert fra NVE Innsjødatabasen)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
